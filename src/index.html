<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Trust Ledger Matrix Pro</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header>
      <div class="header-main">
        <h1>Trust-Ledger Matrix</h1>
        <button id="theme-toggle-btn" class="icon-btn" aria-label="Toggle Theme">🌓</button>
      </div>
      <p id="stats-banner">Connecting cognitive architecture...</p>
      
      <!-- Live Matrix Spatial Filter Bar -->
      <div class="search-container">
        <input type="text" id="matrix-search" placeholder="Type to search synapse prompts or tags... (Ctrl+F)">
        <span id="search-count" class="hidden">0 found</span>
      </div>
    </header>

    <!-- The 3D Spatial Canvas Workspace -->
    <div id="canvas-container">
      <canvas id="matrix-canvas"></canvas>
    </div>

    <!-- Contextual Inspection Panel -->
    <div id="inspection-panel" class="hidden">
      <div class="panel-header">
        <span id="panel-model-badge">MODEL</span>
        <button id="close-panel-btn">×</button>
      </div>
      <div class="panel-scroll">
        <p class="panel-label">Prompt:</p>
        <blockquote id="panel-prompt">Select an interaction synapse to audit...</blockquote>
        <p class="panel-label">Response:</p>
        <blockquote id="panel-response">...</blockquote>
      </div>
      <div id="audit-actions" class="hidden">
        <button id="btn-correct" class="action-btn core-green">Harden Trust (👍)</button>
        <button id="btn-hallucinated" class="action-btn core-red">Flag Lie (👎)</button>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
