<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Trust Ledger Client</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header>
      <div class="header-main">
        <h1>Trust Ledger Matrix</h1>
        <button id="theme-toggle-btn" class="icon-btn" aria-label="Toggle Theme">🌓</button>
      </div>
      <p id="stats-banner">Loading neural interfaces...</p>
      
      <!-- Live Tag Filter Logic -->
      <div class="filter-wrapper">
        <input type="text" id="tag-filter-input" placeholder="Filter by tags (e.g., #coding, #ui)...">
      </div>

      <nav class="tab-nav">
        <button class="nav-btn active" data-target="panel-ledger">Ledger</button>
        <button class="nav-btn" data-target="panel-model-of-you">Model of You</button>
        <button class="nav-btn" data-target="panel-trust-scores">Trust Scores</button>
      </nav>
    </header>

    <main class="content-viewport">
      <!-- PANEL 1: MANUAL FORM & EXPORT -->
      <section id="panel-ledger" class="tab-panel">
        <div class="card form-card">
          <h2>Log dynamic interaction</h2>
          <form id="ledger-form">
            <div class="input-group"><label>AI MODEL</label><input type="text" id="form-model" placeholder="e.g., ChatGPT, Claude" required></div>
            <div class="input-group">
              <label>CONTEXT / PROJECT TYPE</label>
              <select id="form-context">
                <option value="General">General</option>
                <option value="Coding">Coding</option>
                <option value="Research">Research</option>
                <option value="Creative">Creative</option>
              </select>
            </div>
            <div class="input-group"><label>TAGS (Comma separated)</label><input type="text" id="form-tags" placeholder="e.g., #frontend, #bugfix"></div>
            <div class="input-group"><label>PROMPT</label><textarea id="form-prompt" rows="2" placeholder="What did you ask?"></textarea></div>
            <div class="input-group"><label>RESPONSE</label><textarea id="form-response" rows="3" placeholder="What did it say?" required></textarea></div>
            <div class="radios">
              <label class="pill-radio"><input type="radio" name="form-audit" value="true" checked> Accurate (👍)</label>
              <label class="pill-radio"><input type="radio" name="form-audit" value="false"> Hallucinated (👎)</label>
            </div>
            <button type="submit" class="submit-btn">Commit Node</button>
          </form>
        </div>

        <!-- One-Click Markdown Export Component -->
        <div class="card export-card">
          <h2>Documentation Export Engine</h2>
          <p class="subtitle">Compile audited workspace loops into clean markdown project logs.</p>
          <button id="export-md-btn" class="export-btn">Generate Project Documentation (.md)</button>
        </div>
      </section>

      <!-- PANEL 2: MODEL OF YOU GRAPH SYSTEM -->
      <section id="panel-model-of-you" class="tab-panel hidden">
        <div class="card">
          <h2>Your Cognitive Topology</h2>
          <div class="chart-row"><span class="lbl">Coding</span><div class="bar-bg"><div id="bar-coding" class="bar-fill cyan" style="width:0%"></div></div><span id="txt-coding" class="val">0%</span></div>
          <div class="chart-row"><span class="lbl">Research</span><div class="bar-bg"><div id="bar-research" class="bar-fill blue" style="width:0%"></div></div><span id="txt-research" class="val">0%</span></div>
          <div class="chart-row"><span class="lbl">Creative</span><div class="bar-bg"><div id="bar-creative" class="bar-fill purple" style="width:0%"></div></div><span id="txt-creative" class="val">0%</span></div>
          <div class="chart-row"><span class="lbl">General</span><div class="bar-bg"><div id="bar-general" class="bar-fill grey" style="width:0%"></div></div><span id="txt-general" class="val">0%</span></div>
          <p id="profile-insight"></p>
        </div>
      </section>

      <!-- PANEL 3: SCORE MODULE -->
      <section id="panel-trust-scores" class="tab-panel hidden">
        <div class="card">
          <h2>Model Verification Standings</h2>
          <div id="scores-container" class="scores-list"></div>
        </div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
